name: Transcrire (Whisper, gratuit)

on:
  workflow_dispatch:
    inputs:
      dossier:
        default: "assets/montage"
      modele:
        default: "medium"

permissions:
  contents: write

jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Transcrire
        env: { DOSSIER: "${{ inputs.dossier }}", MODELE: "${{ inputs.modele }}" }
        run: |
          case "$DOSSIER$MODELE" in *..*|*" "*) echo "paramètre invalide"; exit 1;; esac
          pip install -q faster-whisper
          mkdir -p livraison
          python3 scripts/transcrire.py "$DOSSIER" livraison/transcription.json "$MODELE" | tee livraison/transcription.txt
      - name: Publier sur la branche « resultats »
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          D=/tmp/pub; mkdir -p $D/transcription-${{ github.run_id }}; cp -r livraison/. $D/transcription-${{ github.run_id }}/ 2>/dev/null || true
          cd $D && git init -q -b resultats
          git config user.name "mira-3d-studio"; git config user.email "studio@users.noreply.github.com"
          U="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q "$U" resultats 2>/dev/null && git reset -q --mixed FETCH_HEAD || true
          git add transcription-${{ github.run_id }} && git commit -qm "Transcription" || exit 0
          for i in 1 2 3 4 5; do git push -q "$U" resultats && break; sleep $((i*5)); git fetch -q "$U" resultats && git rebase -q FETCH_HEAD || true; done
